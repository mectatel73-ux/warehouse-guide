    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root{--red:#c62828;--red-dark:#7f0000;--red-light:#ef5350;--bg:#faf6f6;--card:#fff;--text:#1a1a1a;--muted:#6d5d5d;--border:#f0e0e0;--shadow:0 2px 16px rgba(160,20,20,.06);--radius:16px;--tr:0.3s cubic-bezier(.4,0,.2,1)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:90px}
        .sticky-header{position:sticky;top:0;background:linear-gradient(135deg,#6d0000,#a01010);color:#fff;padding:1rem 1.5rem;box-shadow:0 6px 28px rgba(0,0,0,.2);z-index:100;transition:transform .35s}
        .sticky-header.hidden{transform:translateY(-100%)}
        .header-top{display:flex;align-items:center;gap:14px}
        .header-logo{width:46px;height:46px;border-radius:14px;border:2px solid rgba(255,255,255,.2);object-fit:cover;background:#fff;padding:5px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
        .header-title{font-size:1.35rem;font-weight:800;letter-spacing:-0.5px}
        .header-subtitle{font-size:.76rem;opacity:.8;font-weight:400}
        .search-bar{display:flex;gap:6px;background:#fff;border-radius:60px;padding:5px 5px 5px 18px;min-width:250px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
        .search-bar i{color:var(--red);align-self:center;font-size:.85rem}
        .search-bar input{flex:1;border:none;padding:.55rem 0;font-size:.85rem;outline:none;background:transparent;color:#333}
        .search-bar button{background:var(--red);border:none;border-radius:60px;padding:.5rem 1.4rem;color:#fff;font-weight:700;cursor:pointer;font-size:.85rem;transition:var(--tr)}
        .search-bar button:hover{background:var(--red-dark)}
        .hero-gallery{max-width:900px;margin:0 auto 1.5rem;padding:0 1rem;border-radius:18px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.12);display:none}
        .hero-gallery.visible{display:block}
        .hero-gallery img{width:100%;height:280px;object-fit:cover;display:block}
        .content{max-width:900px;margin:1.5rem auto;padding:0 1rem}
        .accordion{margin-bottom:8px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:#fff;transition:var(--tr)}
        .accordion:hover{box-shadow:0 4px 20px rgba(160,20,20,.05)}
        .accordion-header{display:flex;align-items:center;gap:12px;padding:1rem 1.3rem;cursor:pointer;user-select:none;font-weight:700;font-size:1rem;color:var(--red-dark);background:#fff;transition:var(--tr)}
        .accordion-header:hover{background:#fffafa}
        .accordion-header .acc-icon{font-size:1.3rem;flex-shrink:0}
        .accordion-header .acc-arrow{margin-left:auto;transition:var(--tr);color:var(--muted);font-size:.85rem}
        .accordion.open .accordion-header .acc-arrow{transform:rotate(180deg);color:var(--red)}
        .accordion-body{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.4,0,.2,1)}
        .accordion.open .accordion-body{max-height:10000px;padding:0 1.3rem 1.2rem}
        .accordion-body ul,.accordion-body ol{margin-left:1.4rem;margin-bottom:.8rem}
        .accordion-body li{margin-bottom:5px;font-size:.88rem}
        .note{background:#fff8e1;border-left:5px solid #ff8f00;padding:.9rem 1.2rem;border-radius:0 14px 14px 0;margin:.8rem 0;font-size:.87rem;color:#5d4037}
        .highlight{background:#ffcdd2;padding:2px 7px;border-radius:5px;font-weight:600}
        .photo-gallery{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
        .photo-gallery img{max-width:230px;width:100%;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.07);cursor:pointer;transition:var(--tr);border:2px solid transparent}
        .photo-gallery img:hover{transform:scale(1.03);border-color:var(--red-light);box-shadow:0 8px 28px rgba(160,20,20,.15)}
        .badge{display:inline-block;padding:4px 12px;border-radius:30px;font-size:.7rem;font-weight:700;letter-spacing:.4px}
        .badge-red{background:#ffebee;color:var(--red)}
        .badge-green{background:#e8f5e9;color:#2e7d32}
        .size-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.85rem}
        .size-table th{background:var(--red);color:#fff;padding:10px 14px;text-align:left;font-weight:700}
        .size-table td{padding:10px 14px;border-bottom:1px solid var(--border)}
        .size-table tr:nth-child(even){background:#fffafa}
        footer{text-align:center;margin:2rem 0 0;font-size:.75rem;color:var(--muted)}
        .bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);box-shadow:0 -3px 20px rgba(0,0,0,.05);display:flex;justify-content:space-around;padding:8px 10px;border-top:1px solid var(--border);z-index:200;padding-bottom:max(8px,env(safe-area-inset-bottom))}
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;padding:10px 18px;border-radius:40px;font-size:.7rem;color:var(--muted);font-weight:600;transition:var(--tr)}
        .nav-item i{font-size:1.3rem;color:var(--muted);transition:var(--tr)}
        .nav-item.active{background:var(--red);color:#fff;box-shadow:0 4px 16px rgba(160,20,20,.3)}.nav-item.active i{color:#fff}
        #splash-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,var(--red-dark),var(--red));z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}
        #splash-screen.hidden{opacity:0;visibility:hidden}
        #splash-screen img{width:100px;height:100px;border-radius:24px;object-fit:cover;border:3px solid #fff;box-shadow:0 16px 48px rgba(0,0,0,.35);animation:splashPulse 2s infinite}
        @keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
        #splash-screen .splash-text{color:#fff;margin-top:18px;font-size:1.1rem;font-weight:700;letter-spacing:4px;opacity:0;animation:splashFadeIn .8s .4s forwards}
        @keyframes splashFadeIn{to{opacity:1}}
        #splash-screen .splash-loader{width:50px;height:4px;background:rgba(255,255,255,.2);border-radius:10px;margin-top:20px;overflow:hidden}
        #splash-screen .splash-loader-bar{width:45%;height:100%;background:#fff;border-radius:10px;animation:splashLoading 1.2s infinite}
        @keyframes splashLoading{0%{transform:translateX(-100%)}100%{transform:translateX(220%)}}
        .novelties-header{display:flex;align-items:center;gap:10px;margin-bottom:1rem;padding-bottom:.8rem;border-bottom:2px solid var(--red)}
        .novelties-header i{font-size:1.5rem;color:var(--red)}
        .novelties-header h2{margin:0;color:var(--red-dark);font-size:1.3rem}
        .novelty-card{background:#fffdfd;border-left:5px solid var(--red);border-radius:0 14px 14px 0;padding:1rem 1.2rem;margin-bottom:.8rem}
        .novelty-date{font-size:.75rem;color:var(--red);font-weight:600;margin-bottom:.2rem}
        .novelty-title{font-weight:700;font-size:.95rem;color:var(--red-dark);margin-bottom:.2rem}
        .novelty-desc{font-size:.85rem;color:#555;line-height:1.5}
        .novelties-footer{margin-top:1rem;padding-top:.6rem;border-top:1px solid var(--border);text-align:right;font-size:.7rem;color:#aaa}
        .novelties-loading,.novelties-error,.novelties-empty{text-align:center;padding:3rem;color:var(--muted)}
        .novelties-error{color:var(--red)}
        .stopzones-header{display:flex;align-items:center;gap:10px;margin-bottom:1rem;padding-bottom:.8rem;border-bottom:2px solid #d32f2f}
        .stopzones-header i{font-size:1.5rem;color:#d32f2f}
        .stopzones-header h2{margin:0;color:#b71c1c;font-size:1.3rem}
        .stopzone-alert{background:#fff3e0;border-left:5px solid #ff6f00;padding:.7rem 1rem;border-radius:0 12px 12px 0;margin-bottom:1rem;font-size:.8rem;color:#c62828}
        .stopzone-floor{background:#fafafa;border-radius:12px;margin-bottom:.6rem;overflow:hidden;border:1px solid var(--border)}
        .stopzone-floor-title{background:var(--red);color:#fff;padding:.5rem 1rem;font-weight:700;font-size:.82rem}
        .stopzone-list{padding:.5rem 1rem}
        .stopzone-item{display:flex;justify-content:space-between;padding:.35rem 0;border-bottom:1px solid #fef0f0;font-size:.82rem}
        .stopzone-item:last-child{border-bottom:none}
        .stopzone-zone{font-family:monospace;font-weight:600;color:#333}
        .stopzone-reason{color:var(--red);font-weight:600}
        @media(max-width:800px){.header-title{font-size:1.1rem}.photo-gallery img{max-width:100%}.hero-gallery img{height:180px}}
    </style>
</head>

<script>
var sectionsData=[
    {id:"welcome",icon:"🏠",title:"Введение",content:'<p>Данный регламент описывает требования по размещению и хранению товара на складе Магнит Маркет с целью увеличения скорости сборки и снижения рисков потери и повреждения товара. Товар должен располагаться по ячейкам хранения так, чтобы не требовалось изыскивать дополнительные площади. Рабочее пространство не должно быть захламлено.</p>'},
    {id:"rule-scan-zone",icon:"📱",title:"1.1 Сканирование зоны работы",content:'<p><strong>Для начала размещения необходимо:</strong></p><ul><li>Зайти в программу «PickApp»</li><li>Отсканировать зону работы</li><li>Отсканировать штрихкод грузоместа или акта целиком</li></ul><div class="photo-gallery"><img src="1.1.jpg"><img src="1.1 (2).jpg"><img src="1.1 (3).jpg"><img src="1.1 (4).jpg"></div>'},
    {id:"rule-scan-sku",icon:"📦",title:"1.2 Сканирование SKU и ячейки",content:'<p>После сканирования зоны:</p><ul><li>Отсканируйте штрихкод (SKU) товара</li><li>Укажите количество</li><li>Отсканируйте ячейку</li></ul><div class="photo-gallery"><img src="1.2.jpg"><img src="1.2 (2).jpg"><img src="1.2 (3).jpg"><img src="1.2 (5).jpg"></div>'},
    {id:"rule-check",icon:"🔍",title:"1.3 Сверка ШК и пересчёт",content:'<p>Перед размещением товар проходит пересчёт.<br>✅ <strong>Сверка ШК товара с Актом приёма-передачи ОБЯЗАТЕЛЬНА.</strong></p>'},
    {id:"rule-packing",icon:"🧱",title:"1.4 Требования к упаковке",content:'<ul><li>Сыпучие, острые, магнитные — в плотной упаковке</li><li>Жидкие — вертикально</li><li>Хрупкие — в индивидуальной упаковке</li><li>Тяжёлые — вниз, лёгкие — вверх</li><li>ШК должен быть виден</li></ul>'},
    {id:"floors",icon:"🏢",title:"2. Этажи склада",content:'<ul><li><strong>1 этаж:</strong> сыпучие, жидкие, тяжёлые, нестандарт</li><li><strong>2 этаж:</strong> крупногабарит (>13 701 см³ или длина >40 см)</li><li><strong>3 этаж:</strong> Сейф + ЭКО</li><li><strong>4–6 этажи:</strong> остальные категории</li></ul><div class="photo-gallery"><img src="2 этаж.jpg"><img src="2 этаж..jpg"></div>'},
    {id:"dimensions",icon:"📐",title:"Габариты товаров по полкам",content:'<table class="size-table"><tr><th>Полка</th><th>Объём (куб. см)</th><th>Примечание</th></tr><tr><td>4 полка</td><td>0 – 170</td><td>Макс. сторона ≤15 см</td></tr><tr><td>3,5 полка</td><td>171 – 1000</td><td>Более 15 см → на 3 или 5!</td></tr><tr><td>6 полка</td><td>1001 – 3419</td><td>Макс. сторона ≤40 см, вес ≤3 кг</td></tr><tr><td>1 полка</td><td>3420 – 13700</td><td>Крупногабарит, обувь</td></tr></table><p><strong>Формула:</strong> высота × длина × ширина = объём</p><p>⚠️ <strong>Более 40 см длины — на 2 этаж!</strong></p>'},
    {id:"shelf-1",icon:"🟦",title:"3.1 Первая полка",content:'<p>Крупногабарит: 3420–13700 см³. Также обувь. Допускается деление при личном пересчёте.</p><div class="photo-gallery"><img src="Первая полка 1.jpg"><img src="Первая полка 2.jpg"></div>'},
    {id:"shelf-2",icon:"👕",title:"3.2 Вторая полка",content:'<p><strong>ТОЛЬКО Одежда и Обувь!</strong></p><div class="photo-gallery"><img src="Полка 2.jpg"></div>'},
    {id:"shelf-3",icon:"🟩",title:"3.3 Третья полка",content:'<p>171–1000 см³, макс. сторона ≤40 см. Если есть короб — только мелкоштучный.</p><div class="photo-gallery"><img src="Третья полка.jpg"><img src="Третья полка 2.jpg"></div>'},
    {id:"shelf-4",icon:"🟨",title:"3.4 Четвёртая полка",content:'<p>0–170 см³, макс. сторона ≤15 см. В пластиковые короба.</p><div class="photo-gallery"><img src="четвертая полка 1.jpg"><img src="четвертая полка 2.jpg"></div>'},
    {id:"shelf-5",icon:"🟧",title:"3.5 Пятая полка",content:'<p>Как третья: 171–1000 см³, макс. сторона ≤40 см.</p><div class="photo-gallery"><img src="Пятая полка.jpg"><img src="Пятая полка 2.jpg"></div>'},
    {id:"shelf-6",icon:"🟥",title:"3.6 Шестая полка",content:'<p>1001–3419 см³, вес ≤3 кг, макс. сторона ≤40 см. Обувь, верхняя одежда. ⚖️ Тяжёлые по краям. ≤35 кг.</p><div class="photo-gallery"><img src="шестая полка.jpg"><img src="шестая полка 2.jpg"></div>'},
    {id:"forbidden",icon:"⛔",title:"4. Строго запрещено",content:'<ul><li>2 разных ШК в одной ячейке</li><li>Товар в коробке</li><li>В пакетах, резинках</li><li>Крупный сверху на мелкий</li><li>Вторым рядом</li><li>Поверх существующего</li><li>>35 кг на полку</li><li>Тяжёлый в центр</li><li>Без упаковки</li><li>Скользкие друг на друга</li></ul>'},
    {id:"large-size",icon:"🖼️",title:"5. Крупногабаритный товар",content:'<p>2 этаж: >13 701 см³ или сторона >40 см. Картины, холсты — вертикально, ШК к проходу.</p>'},
    {id:"pallet",icon:"🚜",title:"6. Поддонное размещение",content:'<p><strong>Правила:</strong></p><ul><li><span class="badge badge-red">ТОЛЬКО 1 SKU</span> на поддоне</li><li>Не более 1 поддона в ячейку</li><li>Запрещено штабелировать поддоны</li><li>Вес ≤400 кг на этажах</li><li>Высота ≤160 см</li></ul><div class="photo-gallery"><img src="Поддонка 1.jpg"><img src="Поддонка 2.jpg"></div>'},
    {id:"vetapteka",icon:"💊",title:"Ветаптека — Зоотовары",content:'<p><strong>В 71 ряду выделены стеллажи L.1.71.21 и L.1.71.19 под категорию «Ветаптека».</strong></p><p><span class="badge badge-red">ОБЯЗАТЕЛЬНО</span> — размещаем строго в коробках!</p><p><strong>Категории товаров:</strong></p><ul><li>Антипаразитарные средства</li><li>Бинты и бандажи</li><li>Ветеринарные паспорта</li><li>Витамины и добавки для животных</li><li>Воротники и лечебные ошейники</li><li>Средства для глаз и ушей</li><li>Средства для кожи и шерсти</li><li>Средства для полости рта</li><li>Средства для почек и мочеполовой системы</li><li>Успокоительные средства</li></ul>'},
    {id:"safe",icon:"🔒",title:"7. Сейфовое размещение",content:'<p><strong>Размещением товаров в данные зоны занимаются ответственные сотрудники отдела товародвижения из каждой смены, которые прошли согласование на данный вид работ в службе безопасности, а также имеют допуск по Face ID.</strong></p><div class="photo-gallery"><img src="СейфFaceID 1.jpg"><img src="СейфFaceID 2.jpg"></div><p><strong>Категории товаров, подлежащих размещению в зону сейфа:</strong></p><ul><li>Смартфоны, гаджеты, запчасти и аксессуары к ним — от 500₽ (кроме ЗУ, кабелей, чехлов)</li><li>Фото/видео техника, алкотестеры — от 500₽</li><li>Консоли, наушники, гарнитуры, диктофоны — от 1000₽</li><li>ПК, ноутбуки, роутеры, техника для печати — от 2000₽</li><li>Периферия (клавиатуры, мыши) — от 1000₽</li><li>Power Bank — от 1000₽; все флешки и накопители</li><li>USB-зажигалки, бензиновые зажигалки, спички (кроме пустых кухонных)</li><li>Часы — от 500₽; бижутерия — от 500₽</li><li>Парфюм — от 5000₽; инструменты — от 5000₽</li><li>Одежда: футболки/рубашки от 1000₽; бельё от 1500₽/ед; остальное от 1500₽</li><li>Обувь от 1500₽ или в коробках; ALGA — вся</li><li>Фены от 15000₽; ножи (не кухонные)</li><li>Пневматика ≤3 Дж, страйкбол, арбалеты ≤43 кгс, луки ≤27 кгс</li><li>Автоаксессуары — от 1500₽</li><li>Сертификаты, сим-карты, монеты — всегда в сейф</li></ul>'},
    {id:"dangerous",icon:"☣️",title:"8. Потенциально опасные товары",content:'<div class="photo-gallery"><img src="ГСМ.jpg"></div>'}
];
</script><script>
var NOVELTIES_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRBGkZqupNTmfs7D26nGRV6P0OOLQKHU2iBBhqo2gGChk1jwU88NE3hgeNJyfXwjKTMd8I2vcUg2XmF/pub?gid=0&single=true&output=tsv';
var STOPZONES_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vQGpejo0SiGEXZ3pP4rgSGH4rQqpc26z4rXFZ1qDDe1AtDxUNybzWGrrS_InaASlPZKQLXPFFsUzSIs/pub?output=tsv';
var currentTab='regulations';
function stripHtml(h){var d=document.createElement('div');d.innerHTML=h;return d.textContent||''}
function escapeHtml(s){if(!s)return'';return s.replace(/[&<>]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[m]})}
function formatTime(d){return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}

function renderRegulations(){
    document.getElementById('heroGallery').classList.add('visible');
    var c=document.getElementById('contentArea');c.innerHTML='';
    sectionsData.forEach(function(s){
        var acc=document.createElement('div');acc.className='accordion';acc.id=s.id;
        acc.setAttribute('data-fulltext',(s.title+' '+stripHtml(s.content)).toLowerCase());
        acc.innerHTML='<div class="accordion-header"><span class="acc-icon">'+s.icon+'</span>'+s.title+'<i class="fas fa-chevron-down acc-arrow"></i></div><div class="accordion-body">'+s.content+'</div>';
        acc.querySelector('.accordion-header').addEventListener('click',function(){this.parentElement.classList.toggle('open')});
        c.appendChild(acc);
    });
}

function renderNovelties(){
    document.getElementById('heroGallery').classList.remove('visible');
    document.getElementById('contentArea').innerHTML='<div><div class="novelties-header"><i class="fas fa-bell"></i><h2>🆕 Нововведения</h2></div><p style="color:var(--muted);margin-bottom:1rem;font-size:.85rem">Для сотрудников · Обновляется автоматически</p><div id="novelties-content"><div class="novelties-loading">⏳ Загрузка...</div></div><div id="novelties-footer" class="novelties-footer"></div></div>';
    loadNoveltiesData();
}

function loadNoveltiesData(){
    var cd=document.getElementById('novelties-content'),fd=document.getElementById('novelties-footer');
    if(!cd)return;
    fetch(NOVELTIES_URL).then(function(r){if(!r.ok)throw new Error();return r.text()}).then(function(t){
        var rows=t.split('\n').filter(function(l){return l.trim()});
        if(rows.length<2){cd.innerHTML='<div class="novelties-empty">📭 Пока нет</div>';fd.textContent=formatTime(new Date());return}
        var h='';var found=0;
        for(var i=1;i<rows.length;i++){
            var c=rows[i].split('\t');if(c.length<4)continue;
            var w=c[2].trim().toLowerCase(),s=c[3].trim().toLowerCase();
            if(w.indexOf('старш')!==-1||w.indexOf('специалист')!==-1||w.indexOf('руковод')!==-1)continue;
            if(s!=='актуально'&&s!=='актуальная')continue;
            h+='<div class="novelty-card"><div class="novelty-date">📅 '+escapeHtml(c[0]?.trim()||'')+'</div><div class="novelty-title">'+escapeHtml(c[1]?.trim()||'')+'</div><div class="novelty-desc">'+escapeHtml(c[2]?.trim()||'')+'</div><span class="badge badge-green">Актуально</span></div>';
            found++;
        }
        if(!found){cd.innerHTML='<div class="novelties-empty">✅ Нет нововведений для сотрудников.</div>';fd.textContent=formatTime(new Date());return}
        cd.innerHTML=h;fd.textContent='🔄 '+formatTime(new Date());
    }).catch(function(e){cd.innerHTML='<div class="novelties-error">❌ Ошибка загрузки</div>';fd.textContent='';});
}

function renderStopZones(){
    document.getElementById('heroGallery').classList.remove('visible');
    document.getElementById('contentArea').innerHTML='<div><div class="stopzones-header"><i class="fas fa-stop-circle" style="color:#d32f2f;font-size:1.5rem"></i><h2>🚫 Стоп-зоны склада</h2></div><div class="stopzone-alert">⚠️ <strong>Внимание!</strong> В указанных зонах размещение запрещено.</div><div id="stopzones-content"><div class="novelties-loading">⏳ Загрузка...</div></div><div id="stopzones-footer" class="novelties-footer"></div></div>';
    loadStopZonesData();
}

function loadStopZonesData(){
    var cd=document.getElementById('stopzones-content'),fd=document.getElementById('stopzones-footer');
    if(!cd)return;
    fetch(STOPZONES_URL).then(function(r){if(!r.ok)throw new Error();return r.text()}).then(function(t){
        var rows=t.split('\n').filter(function(l){return l.trim()});
        if(rows.length<2){cd.innerHTML='<div class="novelties-empty">📭 Нет</div>';fd.textContent=formatTime(new Date());return}
        var floors={},cf=null;
        for(var i=1;i<rows.length;i++){var c=rows[i].split('\t'),f=c[0]?.trim()||'',s=c[1]?.trim()||'';if(!f)continue;if(f.toLowerCase().indexOf('этаж')!==-1||f.toLowerCase().indexOf('поддон')!==-1){cf=f;if(!floors[cf])floors[cf]={name:f,zones:[]}}else if(cf)floors[cf].zones.push({zone:f,reason:s||'Стоп'})}
        var fk=Object.keys(floors).filter(function(k){return floors[k].zones.length});
        if(!fk.length){cd.innerHTML='<div class="novelties-empty" style="color:#2e7d32;">✅ Все зоны доступны</div>';fd.textContent=formatTime(new Date());return}
        var h='';fk.forEach(function(k){var fl=floors[k];h+='<div class="stopzone-floor"><div class="stopzone-floor-title">📍 '+escapeHtml(fl.name)+'</div><div class="stopzone-list">';fl.zones.forEach(function(z){h+='<div class="stopzone-item"><span class="stopzone-zone">'+escapeHtml(z.zone)+'</span><span class="stopzone-reason">'+escapeHtml(z.reason)+'</span></div>'});h+='</div></div>'});
        cd.innerHTML=h;fd.textContent='🔄 '+formatTime(new Date());
    }).catch(function(e){cd.innerHTML='<div class="novelties-error">❌ Ошибка</div>';fd.textContent='';});
}

function switchTab(t){
    currentTab=t;
    document.querySelectorAll('.nav-item').forEach(function(b){b.classList.remove('active');if(b.dataset.tab===t)b.classList.add('active')});
    if(t==='regulations')renderRegulations();else if(t==='novelties')renderNovelties();else if(t==='stopzones')renderStopZones();
}

function performSearch(){
    if(currentTab!=='regulations'){switchTab('regulations');setTimeout(performSearch,300);return}
    var q=document.getElementById('searchInput').value.trim().toLowerCase();
    document.getElementById('noResultsMsg')?.remove();
    document.querySelectorAll('.accordion').forEach(function(c){c.querySelectorAll('.highlight').forEach(function(m){var p=m.parentNode;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize()})});
    if(!q){document.querySelectorAll('.accordion').forEach(function(c){c.style.display=''});return}
    var found=false;
    document.querySelectorAll('.accordion').forEach(function(c){
        if((c.dataset.fulltext||'').indexOf(q)!==-1){c.style.display='';c.classList.add('open');highlightInCard(c,q);found=true}else{c.style.display='none'}
    });
    if(!found){var m=document.createElement('div');m.id='noResultsMsg';m.className='note';m.style.textAlign='center';m.innerHTML='<i class="fas fa-search-minus"></i> Ничего не найдено.';document.getElementById('contentArea').appendChild(m)}
}

function highlightInCard(card,q){
    var w=document.createTreeWalker(card,NodeFilter.SHOW_TEXT,{acceptNode:function(n){return['SCRIPT','STYLE','MARK'].indexOf(n.parentElement?.tagName)!==-1?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}}),nr=[];
    while(w.nextNode()){if(w.currentNode.textContent.toLowerCase().indexOf(q)!==-1)nr.push(w.currentNode)}
    nr.forEach(function(n){var s=document.createElement('span');s.innerHTML=n.textContent.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark class="highlight">$1</mark>');n.parentNode.replaceChild(s,n)});
}

document.addEventListener('DOMContentLoaded',function(){
    switchTab('regulations');
    document.querySelectorAll('.nav-item').forEach(function(b){b.addEventListener('click',function(){var t=b.dataset.tab;if(t)switchTab(t)})});
    document.getElementById('searchBtn').addEventListener('click',performSearch);
    document.getElementById('searchInput').addEventListener('keyup',function(e){if(e.key==='Enter')performSearch()});
    var ly=window.scrollY;
    window.addEventListener('scroll',function(){var cy=window.scrollY,h=document.getElementById('stickyHeader');if(cy>ly&&cy>80)h.classList.add('hidden');else h.classList.remove('hidden');ly=cy});
    setInterval(function(){if(currentTab==='novelties')loadNoveltiesData();if(currentTab==='stopzones')loadStopZonesData()},300000);
});

window.addEventListener('load',function(){setTimeout(function(){var s=document.getElementById('splash-screen');if(s){s.classList.add('hidden');setTimeout(function(){s?.remove()},500)}},1400)});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){})}
</script>
</body>
</html>
