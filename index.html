<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Справочник склада | Магнит Маркет</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ММ Склад">
    <link rel="apple-touch-icon" href="МАГНИТОТД_1.jpeg">
    <link rel="icon" type="image/jpeg" href="МАГНИТОТД_1.jpeg">
    <meta name="theme-color" content="#b71c1c">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root{--red:#b71c1c;--red-light:#e53935;--red-dark:#7f0000;--bg:#fef5f5;--card:#fff;--text:#2c1818;--muted:#8b6b6b;--border:#f0d0d0;--shadow:0 2px 12px rgba(180,20,20,.08);--radius:16px;--transition:0.25s ease}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:80px;-webkit-font-smoothing:antialiased}
        .sticky-header{position:sticky;top:0;background:linear-gradient(135deg,var(--red-dark),var(--red));color:#fff;padding:1rem 1.5rem;box-shadow:0 4px 20px rgba(0,0,0,.15);z-index:100;transition:transform .3s}
        .sticky-header.hidden{transform:translateY(-100%)}
        .header-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
        .header-logo{width:42px;height:42px;border-radius:12px;border:2px solid rgba(255,255,255,.3);object-fit:cover;background:#fff;padding:4px}
        .header-title{font-size:1.3rem;font-weight:700;letter-spacing:-0.3px}
        .header-subtitle{font-size:.8rem;opacity:.85;margin-top:2px}
        .header-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:8px}
        .search-bar{display:flex;gap:6px;background:#fff;border-radius:50px;padding:4px 4px 4px 16px;min-width:220px}
        .search-bar i{color:var(--red);align-self:center;font-size:.9rem}
        .search-bar input{flex:1;border:none;padding:.5rem 0;font-size:.85rem;outline:none;background:transparent;color:#333}
        .search-bar button{background:var(--red);border:none;border-radius:50px;padding:.4rem 1.2rem;color:#fff;font-weight:600;cursor:pointer;font-size:.85rem;transition:var(--transition)}
        .search-bar button:active{background:var(--red-dark)}
        .container{display:flex;max-width:1300px;margin:1rem auto;padding:0 1rem;gap:1.5rem}
        .sidebar{flex:0 0 250px;background:var(--card);border-radius:var(--radius);padding:1.2rem;box-shadow:var(--shadow);height:fit-content;position:sticky;top:100px;border:1px solid var(--border)}
        .sidebar h3{font-size:1rem;margin-bottom:1rem;color:var(--red);display:flex;align-items:center;gap:8px}
        .sidebar ul{list-style:none}
        .sidebar li{margin:2px 0}
        .sidebar a{text-decoration:none;color:var(--text);font-size:.82rem;font-weight:500;padding:6px 10px;display:block;border-radius:8px;transition:var(--transition)}
        .sidebar a:hover{background:#fff0f0;color:var(--red)}
        .content{flex:1;background:var(--card);border-radius:var(--radius);padding:1.5rem 2rem;box-shadow:var(--shadow);min-height:400px;border:1px solid var(--border)}
        .card{margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border);scroll-margin-top:100px}
        .card:last-child{border-bottom:none;margin-bottom:0}
        .card h2{font-size:1.4rem;margin-bottom:.8rem;color:var(--red-dark);display:flex;align-items:center;gap:8px;font-weight:700}
        .card ul,.card ol{margin-left:1.5rem;margin-bottom:.8rem}
        .card li{margin-bottom:4px}
        .note{background:#fff8e1;border-left:4px solid #ff8f00;padding:.8rem 1rem;border-radius:0 12px 12px 0;margin:.8rem 0;font-size:.9rem}
        .highlight{background:#ffcdd2;padding:2px 6px;border-radius:4px;font-weight:500}
        .photo-gallery{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
        .photo-gallery img{max-width:260px;width:100%;border-radius:12px;box-shadow:var(--shadow);cursor:pointer;transition:var(--transition);border:2px solid transparent}
        .photo-gallery img:hover{transform:scale(1.02);border-color:var(--red-light)}
        footer{text-align:center;margin:1.5rem 0 0;font-size:.75rem;color:var(--muted)}
        .bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#fff;box-shadow:0 -2px 16px rgba(0,0,0,.06);display:flex;justify-content:space-around;padding:8px 8px;border-top:1px solid var(--border);z-index:200;padding-bottom:max(8px,env(safe-area-inset-bottom))}
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:8px 16px;border-radius:40px;font-size:.7rem;color:var(--muted);font-weight:500;transition:var(--transition)}
        .nav-item i{font-size:1.3rem;color:var(--muted);transition:var(--transition)}
        .nav-item.active{background:#fff0f0;color:var(--red)}.nav-item.active i{color:var(--red)}
        #splash-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,var(--red-dark),var(--red));z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}
        #splash-screen.hidden{opacity:0;visibility:hidden}
        #splash-screen img{width:100px;height:100px;border-radius:24px;object-fit:cover;border:3px solid #fff;box-shadow:0 12px 40px rgba(0,0,0,.3);animation:splashPulse 2s infinite}
        @keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
        #splash-screen .splash-text{color:#fff;margin-top:18px;font-size:1.1rem;font-weight:600;letter-spacing:3px;opacity:0;animation:splashFadeIn .8s .4s forwards}
        @keyframes splashFadeIn{to{opacity:1}}
        #splash-screen .splash-loader{width:50px;height:3px;background:rgba(255,255,255,.25);border-radius:10px;margin-top:20px;overflow:hidden}
        #splash-screen .splash-loader-bar{width:50%;height:100%;background:#fff;border-radius:10px;animation:splashLoading 1.2s infinite}
        @keyframes splashLoading{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
        .novelties-container{padding:0}
        .novelties-header{display:flex;align-items:center;gap:10px;margin-bottom:1rem;padding-bottom:.8rem;border-bottom:2px solid var(--red)}
        .novelties-header i{font-size:1.5rem;color:var(--red)}
        .novelties-header h2{margin:0;color:var(--red-dark);font-size:1.3rem}
        .novelty-card{background:#fffdfd;border-left:4px solid var(--red);border-radius:0 12px 12px 0;padding:.9rem 1rem;margin-bottom:.8rem;transition:var(--transition)}
        .novelty-card:hover{box-shadow:var(--shadow)}
        .novelty-date{font-size:.75rem;color:var(--red);font-weight:600;margin-bottom:.2rem}
        .novelty-title{font-weight:700;font-size:.95rem;color:var(--red-dark);margin-bottom:.2rem}
        .novelty-desc{font-size:.85rem;color:#555;line-height:1.5}
        .novelty-badge{display:inline-block;background:#e8f5e9;color:#2e7d32;padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:600;margin-top:.4rem}
        .novelties-footer{margin-top:1rem;padding-top:.6rem;border-top:1px solid var(--border);text-align:right;font-size:.7rem;color:#aaa}
        .novelties-loading,.novelties-error,.novelties-empty{text-align:center;padding:3rem;color:var(--muted)}
        .novelties-error{color:var(--red)}
        .stopzones-container{padding:0}
        .stopzones-header{display:flex;align-items:center;gap:10px;margin-bottom:1rem;padding-bottom:.8rem;border-bottom:2px solid #d32f2f}
        .stopzones-header i{font-size:1.5rem;color:#d32f2f}
        .stopzones-header h2{margin:0;color:#b71c1c;font-size:1.3rem}
        .stopzone-alert{background:#fff3e0;border-left:4px solid #ff6f00;padding:.7rem 1rem;border-radius:0 10px 10px 0;margin-bottom:1rem;font-size:.8rem;color:#c62828}
        .stopzone-floor{background:#fafafa;border-radius:10px;margin-bottom:.6rem;overflow:hidden;border:1px solid var(--border)}
        .stopzone-floor-title{background:var(--red);color:#fff;padding:.5rem .8rem;font-weight:600;font-size:.8rem}
        .stopzone-list{padding:.4rem .8rem}
        .stopzone-item{display:flex;justify-content:space-between;padding:.3rem 0;border-bottom:1px solid #fef0f0;font-size:.8rem}
        .stopzone-item:last-child{border-bottom:none}
        .stopzone-zone{font-family:monospace;font-weight:600;color:#333}
        .stopzone-reason{color:var(--red);font-weight:500}
        @media(max-width:800px){.container{flex-direction:column;margin:.5rem}.sidebar{position:static;flex:1}.content{padding:1rem}.header-title{font-size:1rem}.photo-gallery img{max-width:100%}}
    </style>
</head>

<script>
var sections=[
    {id:"welcome",title:"🏠 Введение",content:'<p>Данный регламент описывает требования по размещению и хранению товара на складе Магнит Маркет с целью увеличения скорости сборки и снижения рисков потери и повреждения товара. Товар должен располагаться по ячейкам хранения так, чтобы не требовалось изыскивать дополнительные площади. Рабочее пространство не должно быть захламлено.</p>'},
    {id:"rule-scan-zone",title:"📱 1.1 Сканирование зоны работы",content:'<p><strong>Для начала размещения необходимо:</strong></p><ul><li>Зайти в программу «PickApp»</li><li>Отсканировать зону работы</li><li>Отсканировать штрихкод грузоместа или акта целиком</li></ul><div class="photo-gallery"><img src="1.1.jpg"><img src="1.1 (2).jpg"><img src="1.1 (3).jpg"><img src="1.1 (4).jpg"></div>'},
    {id:"rule-scan-sku",title:"📦 1.2 Сканирование SKU и ячейки",content:'<p>После сканирования зоны:</p><ul><li>Отсканируйте штрихкод (SKU) товара</li><li>Укажите количество</li><li>Отсканируйте ячейку</li></ul><div class="photo-gallery"><img src="1.2.jpg"><img src="1.2 (2).jpg"><img src="1.2 (3).jpg"><img src="1.2 (5).jpg"></div>'},
    {id:"rule-check",title:"🔍 1.3 Сверка ШК и пересчёт",content:'<p>Перед размещением товар проходит пересчёт.<br>✅ <strong>Сверка ШК товара с Актом приёма-передачи ОБЯЗАТЕЛЬНА.</strong></p>'},
    {id:"rule-packing",title:"🧱 1.4 Требования к упаковке",content:'<ul><li>Сыпучие, острые, магнитные — в плотной упаковке</li><li>Жидкие — вертикально</li><li>Хрупкие — в индивидуальной упаковке</li><li>Тяжёлые — вниз, лёгкие — вверх</li><li>ШК должен быть виден</li></ul>'},
    {id:"floors",title:"🏢 2. Этажи склада",content:'<ul><li><strong>1 этаж:</strong> сыпучие, жидкие, тяжёлые, нестандарт</li><li><strong>2 этаж:</strong> крупногабарит (>13 701 см³)</li><li><strong>3 этаж:</strong> Сейф + ЭКО</li><li><strong>4–6 этажи:</strong> остальные категории</li></ul><div class="photo-gallery"><img src="2 этаж.jpg"><img src="2 этаж..jpg"></div>'},
    {id:"shelf-1",title:"🟦 3.1 Первая полка",content:'<p>Крупногабарит: 3420–13700 см³. Также обувь. Допускается деление товара при личном пересчёте.</p><div class="photo-gallery"><img src="Первая полка 1.jpg"><img src="Первая полка 2.jpg"></div>'},
    {id:"shelf-2",title:"👕 3.2 Вторая полка",content:'<p><strong>ТОЛЬКО Одежда и Обувь!</strong> Другой товар ЗАПРЕЩЁН.</p><div class="photo-gallery"><img src="Полка 2.jpg"></div>'},
    {id:"shelf-3",title:"🟩 3.3 Третья полка",content:'<p>Небольшие товары: 171–1000 см³, макс. сторона ≤40 см. Если есть короб — только мелкоштучный.</p><div class="photo-gallery"><img src="Третья полка.jpg"><img src="Третья полка 2.jpg"></div>'},
    {id:"shelf-4",title:"🟨 3.4 Четвёртая полка",content:'<p>Мелкоштучный: 0–170 см³, макс. сторона ≤15 см. В пластиковые короба.</p><div class="photo-gallery"><img src="четвертая полка 1.jpg"><img src="четвертая полка 2.jpg"></div>'},
    {id:"shelf-5",title:"🟧 3.5 Пятая полка",content:'<p>Как третья: 171–1000 см³, макс. сторона ≤40 см.</p><div class="photo-gallery"><img src="Пятая полка.jpg"><img src="Пятая полка 2.jpg"></div>'},
    {id:"shelf-6",title:"🟥 3.6 Шестая полка",content:'<p>1001–3419 см³, вес ≤3 кг, макс. сторона ≤40 см. Обувь, верхняя одежда. ⚖️ Тяжёлые по краям. Общий вес ≤35 кг.</p><div class="photo-gallery"><img src="шестая полка.jpg"><img src="шестая полка 2.jpg"></div>'},
    {id:"forbidden",title:"⛔ 4. Строго запрещено",content:'<ul><li>2 одинаковых товара с разными ШК в одной ячейке</li><li>Товар в коробке (извлекать)</li><li>В пакетах, резинках, с накладной</li><li>Крупный сверху на мелкий</li><li>Вторым рядом</li><li>Поверх существующего</li><li>>35 кг на полку</li><li>Тяжёлый в центр полки</li><li>Без упаковки / повреждённая упаковка</li><li>Скользкие друг на друга</li></ul>'},
    {id:"large-size",title:"🖼️ 5. Крупногабаритный товар",content:'<p>2 этаж: >13 701 см³ или сторона >40 см. Картины, холсты, автоковры, телевизоры.<br>❗ Картины и холсты — строго вертикально, ШК к проходу.</p>'},
    {id:"pallet",title:"🚜 6. Поддонное размещение",content:'<p>Допускается для больших партий или крупногабарита.</p><p><strong>Правила:</strong></p><ul><li><strong>ТОЛЬКО 1 SKU на поддоне!</strong></li><li>Не более 1 поддона в ячейку</li><li>Запрещено складировать поддоны друг на друга</li><li>Вес поддонки <strong>не более 400 кг</strong> на этажах</li><li>Высота поддона ≤160 см</li></ul><div class="photo-gallery"><img src="Поддонка 1.jpg"><img src="Поддонка 2.jpg"></div>'},
    {id:"safe",title:"🔒 7. Сейфовое размещение",content:'<p><strong>Размещением товаров в данные зоны занимаются ответственные сотрудники отдела товародвижения из каждой смены, которые прошли согласование на данный вид работ в службе безопасности, а также имеют допуск по Face ID.</strong></p><div class="photo-gallery"><img src="СейфFaceID 1.jpg"><img src="СейфFaceID 2.jpg"></div><p><strong>Категории товаров, подлежащих размещению в зону сейфа:</strong></p><ul><li>Смартфоны, гаджеты, запчасти и аксессуары к ним (телефоны, смарт-часы, фитнес-браслеты, планшеты, электронные книги и проч.) — от 500₽ (исключая ЗУ, кабели, чехлы; исключение ALGA и т.п.)</li><li>Фото и видео техника, алкотестеры — от 500₽</li><li>Консоли и видеоигры, микрофоны, портативная акустика, радиосистемы, плееры, наушники и гарнитуры, диктофоны — от 1000₽</li><li>Оргтехника и оборудование (компьютеры, ноутбуки, Wi-Fi роутеры, техника для печати) — от 2000₽</li><li>Периферия и аксессуары к оргтехнике (клавиатуры, мыши, игровые наборы) — от 1000₽</li><li>Внешний аккумулятор Power Bank — от 1000₽</li><li>Все внешние накопители, флешкарты</li><li>USB-зажигалки, бензиновые зажигалки, спички (кроме пустых кухонных)</li><li>Часы наручные — от 500₽</li><li>Вся бижутерия — от 500₽</li><li>Парфюм (туалетная вода, духи, одеколоны, масла) — от 5000₽</li><li>Строительные инструменты (шуруповёрты, мелкий/средний) — от 5000₽</li><li>Одежда: футболки, блузки, майки, рубашки — от 1000₽; носочно-чулочные, нижнее бельё — от 1500₽ за 1 ед.; остальная одежда — от 1500₽ (кроме верхней, халатов, спецодежды — вне сейфа)</li><li>Вся одежда марки ALGA</li><li>Обувь — от 1500₽ или в коробках</li><li>Фены — от 15000₽</li><li>Ножи (кроме канцелярских и кухонных)</li><li>Пневматика (до 3 Дж), страйкбол, шумовые патроны, арбалеты (≤43 кгс), луки (≤27 кгс)</li><li>Авто аксессуары (сканеры, лампочки и проч.) — от 1500₽</li><li>Подарочные сертификаты, сим-карты, коды активации, подлинные банкноты, монеты — НЕЗАВИСИМО от стоимости</li></ul>'},
    {id:"dangerous",title:"☣️ 8. Потенциально опасные товары",content:'<div class="note"><i class="fas fa-skull-crossbones"></i> <strong>Опасные грузы — правила от руководителя смены:</strong><ul><li>Легковоспламеняющиеся жидкости (лаки, растворители)</li><li>Едкие вещества (кислоты, щёлочи)</li><li>Газовые баллончики, спреи, аэрозоли</li></ul>⚠️ Запрещено размещать с обычными товарами без спецмаркировки.<br><br><strong>По ГСМ и химии:</strong><br>Горючее: «ГАЗ» — в Зону НП всегда. Моторные масла, эмали, краски — в Зону НП. Антифриз, тормозная жидкость, бензин, спирт — от 2 л в Зону НП, <2 л — на этаж. Химикаты, яды — жидкое в Зону НП, остальное на этаж.</div><div class="photo-gallery"><img src="ГСМ.jpg"></div>'}
];
</script><script>
var NOVELTIES_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRBGkZqupNTmfs7D26nGRV6P0OOLQKHU2iBBhqo2gGChk1jwU88NE3hgeNJyfXwjKTMd8I2vcUg2XmF/pub?gid=0&single=true&output=tsv';
var STOPZONES_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vQGpejo0SiGEXZ3pP4rgSGH4rQqpc26z4rXFZ1qDDe1AtDxUNybzWGrrS_InaASlPZKQLXPFFsUzSIs/pub?output=tsv';
var currentTab='regulations';
function stripHtml(h){var d=document.createElement('div');d.innerHTML=h;return d.textContent||''}
function escapeHtml(s){if(!s)return'';return s.replace(/[&<>]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[m]})}
function formatTime(d){return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function renderRegulations(){
    document.getElementById('sidebarContainer').style.display='block';
    var c=document.getElementById('contentArea');c.innerHTML='';
    sections.forEach(function(s){
        var card=document.createElement('div');card.className='card';card.id=s.id;
        card.setAttribute('data-fulltext',(s.title+' '+stripHtml(s.content)).toLowerCase());
        card.innerHTML='<h2>'+s.title+'</h2>'+s.content;c.appendChild(card);
    });
    buildTOC();
}
function buildTOC(){
    var l=document.getElementById('tableOfContents');l.innerHTML='';
    sections.forEach(function(s){
        var li=document.createElement('li'),a=document.createElement('a');
        a.href='#';a.textContent=s.title;
        a.addEventListener('click',function(e){e.preventDefault();document.getElementById(s.id)?.scrollIntoView({behavior:'smooth'})});
        li.appendChild(a);l.appendChild(li);
    });
}
function renderNovelties(){
    document.getElementById('sidebarContainer').style.display='none';
    document.getElementById('contentArea').innerHTML='<div class="novelties-container"><div class="novelties-header"><i class="fas fa-bell"></i><h2>🆕 Нововведения</h2></div><p style="color:var(--muted);margin-bottom:1rem;font-size:.85rem">Для сотрудников · Обновляется автоматически</p><div id="novelties-content"><div class="novelties-loading">⏳ Загрузка...</div></div><div id="novelties-footer" class="novelties-footer"></div></div>';
    loadNoveltiesData();
}
function loadNoveltiesData(){
    var cd=document.getElementById('novelties-content'),fd=document.getElementById('novelties-footer');
    if(!cd)return;
    fetch(NOVELTIES_URL).then(function(r){if(!r.ok)throw new Error();return r.text()}).then(function(t){
        var rows=t.split('\n').filter(function(l){return l.trim()});
        if(rows.length<2){cd.innerHTML='<div class="novelties-empty">📭 Пока нет</div>';fd.textContent=formatTime(new Date());return}
        var h='';var found=0;
        for(var i=1;i<rows.length;i++){
            var c=rows[i].split('\t');if(c.length<4)continue;
            var w=c[2].trim().toLowerCase(),s=c[3].trim().toLowerCase();
            if(w.indexOf('старш')!==-1||w.indexOf('специалист')!==-1||w.indexOf('руковод')!==-1)continue;
            if(s!=='актуально'&&s!=='актуальная')continue;
            h+='<div class="novelty-card"><div class="novelty-date">📅 '+escapeHtml(c[0]?.trim()||'')+'</div><div class="novelty-title">'+escapeHtml(c[1]?.trim()||'')+'</div><div class="novelty-desc">'+escapeHtml(c[2]?.trim()||'')+'</div><span class="novelty-badge">Актуально</span></div>';
            found++;
        }
        if(!found){cd.innerHTML='<div class="novelties-empty">✅ Нет нововведений для сотрудников.</div>';fd.textContent=formatTime(new Date());return}
        cd.innerHTML=h;fd.textContent='🔄 '+formatTime(new Date());
    }).catch(function(e){cd.innerHTML='<div class="novelties-error">❌ Ошибка загрузки</div>';fd.textContent='';});
}
function renderStopZones(){
    document.getElementById('sidebarContainer').style.display='none';
    document.getElementById('contentArea').innerHTML='<div class="stopzones-container"><div class="stopzones-header"><i class="fas fa-ban"></i><h2>🚫 Стоп-зоны склада</h2></div><div class="stopzone-alert">⚠️ <strong>Внимание!</strong> В указанных зонах размещение запрещено.</div><div id="stopzones-content"><div class="novelties-loading">⏳ Загрузка...</div></div><div id="stopzones-footer" class="novelties-footer"></div></div>';
    loadStopZonesData();
}
function loadStopZonesData(){
    var cd=document.getElementById('stopzones-content'),fd=document.getElementById('stopzones-footer');
    if(!cd)return;
    fetch(STOPZONES_URL).then(function(r){if(!r.ok)throw new Error();return r.text()}).then(function(t){
        var rows=t.split('\n').filter(function(l){return l.trim()});
        if(rows.length<2){cd.innerHTML='<div class="novelties-empty">📭 Нет</div>';fd.textContent=formatTime(new Date());return}
        var floors={},cf=null;
        for(var i=1;i<rows.length;i++){var c=rows[i].split('\t'),f=c[0]?.trim()||'',s=c[1]?.trim()||'';if(!f)continue;if(f.toLowerCase().indexOf('этаж')!==-1||f.toLowerCase().indexOf('поддон')!==-1){cf=f;if(!floors[cf])floors[cf]={name:f,zones:[]}}else if(cf)floors[cf].zones.push({zone:f,reason:s||'Стоп'})}
        var fk=Object.keys(floors).filter(function(k){return floors[k].zones.length});
        if(!fk.length){cd.innerHTML='<div class="novelties-empty" style="color:#2e7d32;">✅ Все зоны доступны</div>';fd.textContent=formatTime(new Date());return}
        var h='';fk.forEach(function(k){var fl=floors[k];h+='<div class="stopzone-floor"><div class="stopzone-floor-title">📍 '+escapeHtml(fl.name)+'</div><div class="stopzone-list">';fl.zones.forEach(function(z){h+='<div class="stopzone-item"><span class="stopzone-zone">'+escapeHtml(z.zone)+'</span><span class="stopzone-reason">'+escapeHtml(z.reason)+'</span></div>'});h+='</div></div>'});
        cd.innerHTML=h;fd.textContent='🔄 '+formatTime(new Date());
    }).catch(function(e){cd.innerHTML='<div class="novelties-error">❌ Ошибка</div>';fd.textContent='';});
}
function switchTab(t){
    currentTab=t;
    document.querySelectorAll('.nav-item').forEach(function(b){b.classList.remove('active');if(b.dataset.tab===t)b.classList.add('active')});
    if(t==='regulations')renderRegulations();else if(t==='novelties')renderNovelties();else if(t==='stopzones')renderStopZones();
}
function performSearch(){
    if(currentTab!=='regulations'){switchTab('regulations');setTimeout(performSearch,300);return}
    var q=document.getElementById('searchInput').value.trim().toLowerCase();
    document.getElementById('noResultsMsg')?.remove();
    document.querySelectorAll('.card').forEach(function(c){c.querySelectorAll('.highlight').forEach(function(m){var p=m.parentNode;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize()})});
    if(!q){document.querySelectorAll('.card').forEach(function(c){c.style.display='block'});return}
    var found=false;
    document.querySelectorAll('.card').forEach(function(c){if((c.dataset.fulltext||'').indexOf(q)!==-1){c.style.display='block';highlightInCard(c,q);found=true}else c.style.display='none'});
    if(!found){var m=document.createElement('div');m.id='noResultsMsg';m.className='note';m.style.textAlign='center';m.innerHTML='<i class="fas fa-search-minus"></i> Ничего не найдено.';document.getElementById('contentArea').appendChild(m)}
}
function highlightInCard(card,q){
    var w=document.createTreeWalker(card,NodeFilter.SHOW_TEXT,{acceptNode:function(n){return['SCRIPT','STYLE','MARK'].indexOf(n.parentElement?.tagName)!==-1?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}}),nr=[];
    while(w.nextNode()){if(w.currentNode.textContent.toLowerCase().indexOf(q)!==-1)nr.push(w.currentNode)}
    nr.forEach(function(n){var s=document.createElement('span');s.innerHTML=n.textContent.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark class="highlight">$1</mark>');n.parentNode.replaceChild(s,n)});
}
document.addEventListener('DOMContentLoaded',function(){
    switchTab('regulations');
    document.querySelectorAll('.nav-item').forEach(function(b){b.addEventListener('click',function(){var t=b.dataset.tab;if(t)switchTab(t)})});
    document.getElementById('searchBtn').addEventListener('click',performSearch);
    document.getElementById('searchInput').addEventListener('keyup',function(e){if(e.key==='Enter')performSearch()});
    var ly=window.scrollY;
    window.addEventListener('scroll',function(){var cy=window.scrollY,h=document.getElementById('stickyHeader');if(cy>ly&&cy>80)h.classList.add('hidden');else h.classList.remove('hidden');ly=cy});
    setInterval(function(){if(currentTab==='novelties')loadNoveltiesData();if(currentTab==='stopzones')loadStopZonesData()},300000);
});
window.addEventListener('load',function(){setTimeout(function(){var s=document.getElementById('splash-screen');if(s){s.classList.add('hidden');setTimeout(function(){s?.remove()},500)}},1400)});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){})}
</script>
</body>
</html>
